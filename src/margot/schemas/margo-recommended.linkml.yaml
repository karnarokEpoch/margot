# Margot recommended application description schema (Schema B) — margot's own content.
#
# Unlike application-description.linkml.yaml this file is NOT a vendored upstream snapshot:
# it is curated here, so it carries no pinned commit and `margot verify` prints no draft-spec
# line for it. It is an opt-in lint pass (`margot verify --recommend`), never a gate.
#
# ---------------------------------------------------------------------------------------
# Overlay mechanism — decision
# ---------------------------------------------------------------------------------------
# "Overlay Schema A" is not a LinkML primitive. Three mechanisms were prototyped against a
# real descriptor through the same runner Schema A uses
# (`validation/linkml_runner.py::run_validation`, i.e. JsonschemaValidationPlugin(closed=True)
# + RecommendedSlotsPlugin + MaximumCardinalityPlugin):
#
# CHOSEN — import Schema A, constrain it through `is_a` subclasses.
#   Schema A is imported by its bare relative name (`application-description.linkml`, see
#   `imports:` below) and every class this file constrains is declared as a subclass of its
#   Schema A counterpart, adding only `slot_usage`. Constraints reach nested classes by
#   re-ranging the parent slot at each level: RecommendedApplicationDescription.metadata ->
#   RecommendedMetadata.catalog -> RecommendedCatalog.application ->
#   RecommendedApplicationMetadata. `class_induced_slots` resolves those overrides, so
#   RecommendedSlotsPlugin walks the whole chain. Verified: a fully-compliant descriptor
#   yields zero findings, and the relative import resolves identically from an editable
#   checkout and from an installed wheel (importlib.resources hands both a real directory,
#   and hatchling ships both YAML files side by side in margot/schemas/).
#   Consequence of importing: every Schema A constraint is inherited, so when Schema A already
#   fails, Schema B repeats those errors on top of its own recommendations. Accepted — Schema B
#   only runs on request and never changes the verdict, and re-deriving a constraint-free copy
#   of Schema A is exactly the maintenance fork rejected below.
#
# REJECTED — standalone schema, no import, classes redeclared with only the constrained
#   slots. `JsonschemaValidationPlugin(closed=True)` rejects every slot the schema does not
#   declare, so a spec-valid descriptor came back with four spurious "Additional properties
#   are not allowed" ERRORs (apiVersion/id/kind, author.email, deploymentProfiles[].type/id,
#   components[].properties). Making it clean would mean re-declaring all 790 lines of
#   Schema A here — a maintenance fork of the spec, which is exactly what vendoring +
#   importing avoids.
#
# REJECTED — import Schema A and redeclare the same class names with added `slot_usage`.
#   LinkML shadows rather than deep-merges a same-named class from an import: the
#   redeclaration dropped every inherited attribute, and even the compliant descriptor
#   failed with "Additional properties are not allowed ('apiVersion', 'deploymentProfiles',
#   'id', 'kind', 'metadata' were unexpected)".
#
# ---------------------------------------------------------------------------------------
# Severity mapping
# ---------------------------------------------------------------------------------------
# `recommended: true` slots surface through RecommendedSlotsPlugin as LinkML WARN, which
# `linkml_runner._SEVERITY_MAP` already turns into `Severity.WARNING` — never ERROR.
# `minimum_cardinality` becomes a JSON Schema `minItems`, so an empty list is reported by
# JsonschemaValidationPlugin as `Severity.ERROR`. That severity is kept as LinkML reports it
# rather than downgraded: Schema B findings do not affect `passed` or the exit code at this
# stage regardless of severity, and preserving the distinction is what `--strict` will act on.
#
# Scope note: OCI artifact annotations (`org.opencontainers.image.*`) are deliberately absent
# — they are written by `push`, not fields of the application description.
# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://margot.margo.org/margo-recommended
name: MargoRecommended
title: Margot Recommended Application Description Schema
description: >-
  Margot's curated recommendations on top of the Margo application description spec.
  Flags fields that are optional in the specification but expected of a well-formed,
  catalog-ready application, and tightens cardinality where the spec accepts an empty list.
version: 1.0
prefixes:
  linkml: https://w3id.org/linkml/
  margot: https://margot.margo.org/
default_prefix: margot
imports:
  - linkml:types
  # Relative to this file's directory. LinkML appends the `.yaml` extension itself, so the
  # vendored application-description.linkml.yaml is named without it.
  - application-description.linkml

classes:
  RecommendedApplicationDescription:
    description: >-
      Root class for the recommended pass. Identical to the spec's ApplicationDescription,
      with the metadata and deploymentProfiles slots re-ranged onto their recommended
      counterparts.
    is_a: ApplicationDescription
    slot_usage:
      metadata:
        range: RecommendedMetadata
      deploymentProfiles:
        description: >-
          The spec requires the slot but accepts an empty list; an application description
          that declares no deployment profile cannot be installed anywhere.
        range: RecommendedDeploymentProfile
        minimum_cardinality: 1

  RecommendedMetadata:
    description: Application metadata with a recommended human-readable description.
    is_a: Metadata
    slot_usage:
      description:
        description: >-
          Catalogs and marketplaces show this text next to the application name. Without it
          the application is listed with nothing but its title.
        recommended: true
      catalog:
        range: RecommendedCatalog

  RecommendedCatalog:
    description: Catalog metadata with recommended author and application blocks.
    is_a: Catalog
    slot_usage:
      application:
        description: >-
          Holds the discovery metadata (icon, description file, release notes) recommended
          below; optional in the spec.
        range: RecommendedApplicationMetadata
        recommended: true
      author:
        description: >-
          Optional in the spec. Recommended so consumers have a contact for the application
          beyond the providing organization.
        recommended: true

  RecommendedApplicationMetadata:
    description: >-
      Application-specific catalog metadata. All three slots are optional in the spec and
      recommended here: they are what a catalog needs to present the application to a user.
    is_a: ApplicationMetadata
    slot_usage:
      icon:
        description: Without an icon the application renders as a placeholder tile.
        recommended: true
      descriptionFile:
        description: The long-form description a catalog shows on the application's page.
        recommended: true
      releaseNotes:
        description: Lets an operator tell what changed before accepting an update.
        recommended: true

  RecommendedDeploymentProfile:
    description: A deployment profile that must declare at least one component.
    is_a: DeploymentProfile
    slot_usage:
      components:
        description: >-
          The spec requires the slot but accepts an empty list; a profile with no component
          deploys nothing.
        minimum_cardinality: 1
