# Margot recommended application description schema (Schema B) — margot's own content.
#
# Unlike application-description.linkml.yaml this file is NOT a vendored upstream snapshot:
# it is curated here, so it carries no pinned commit and `margot verify` prints no draft-spec
# line for it. It is an opt-in lint pass (`margot verify --recommend`), never a gate.
#
# Scope note: OCI artifact annotations (`org.opencontainers.image.*`) are deliberately absent
# — they are written by `push`, not fields of the application description.
# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://margot.margo.org/margo-recommended
name: MargoRecommended
title: Margot Recommended Application Description Schema
description: >-
  Margot's curated recommendations on top of the Margo application description spec.
  Standalone: does not import the vendored upstream schema, so it never silently changes
  when that file is re-vendored. Flags fields that are optional in the specification but
  expected of a well-formed, catalog-ready application, tightens cardinality where the spec
  accepts an empty list, and enforces the spec's own required-field set directly.
version: 1.0
prefixes:
  linkml: https://w3id.org/linkml/
  margot: https://margot.margo.org/
default_prefix: margot
imports:
  - linkml:types

classes:
  RecommendedApplicationDescription:
    description: >-
      Root class for the recommended pass. Declares every top-level field the spec allows on
      `ApplicationDescription` (including Schema A's own `kind` addition, accepted but not
      required) so a spec-valid descriptor validates cleanly under `closed=True`, and marks
      `apiVersion`, `id`, `metadata` and `deploymentProfiles` required per the spec.
    attributes:
      apiVersion:
        description: Identifier of the version of the API the object definition follows.
        range: string
        required: true
      kind:
        description: >-
          Specifies the object type. Not part of the upstream spec's documented top-level
          attributes; accepted here for compatibility with descriptors that carry it, but not
          required by Schema B.
        range: string
      id:
        description: >-
          An identifier for the application. Lower case letters, numbers and dashes only, at
          most 200 characters.
        range: string
        required: true
      metadata:
        description: Metadata element specifying characteristics about the application.
        range: RecommendedMetadata
        required: true
      deploymentProfiles:
        description: >-
          The spec requires the slot but accepts an empty list; an application description
          that declares no deployment profile cannot be installed anywhere.
        range: RecommendedDeploymentProfile
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
      parameters:
        description: Configurable parameters to use when installing, or updating, the application.
        range: RecommendedParameter
        multivalued: true
        inlined: true
        inlined_as_list: false
      configuration:
        description: How parameters should be displayed to the user and validated.
        range: RecommendedConfiguration
    slots:
      - x-placeholder-extensions

  RecommendedMetadata:
    description: Application metadata with a recommended human-readable description.
    attributes:
      name:
        description: The application's official name.
        range: string
        required: true
      description:
        description: >-
          Catalogs and marketplaces show this text next to the application name. Without it
          the application is listed with nothing but its title.
        range: string
        recommended: true
      version:
        description: The application's version.
        range: string
        required: true
      catalog:
        description: Catalog element specifying the application's metadata for enabling its discovery.
        range: RecommendedCatalog
        required: true

  RecommendedCatalog:
    description: Catalog metadata with recommended author and application blocks.
    attributes:
      application:
        description: >-
          Holds the discovery metadata (icon, description file, release notes) recommended
          below; optional in the spec.
        range: RecommendedApplicationMetadata
        recommended: true
      author:
        description: >-
          Optional in the spec. Recommended so consumers have a contact for the application
          beyond the providing organization.
        range: RecommendedAuthor
        multivalued: true
        inlined: true
        inlined_as_list: true
        recommended: true
      organization:
        description: >-
          Organization element specifying metadata about the organization/company providing
          the application.
        range: RecommendedOrganization
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true

  RecommendedApplicationMetadata:
    description: >-
      Application-specific catalog metadata. All three highlighted slots are optional in the
      spec and recommended here: they are what a catalog needs to present the application to
      a user. Other spec-allowed slots are declared so they do not trip `closed=True`.
    attributes:
      descriptionFile:
        description: The long-form description a catalog shows on the application's page.
        range: string
        recommended: true
      icon:
        description: Without an icon the application renders as a placeholder tile.
        range: string
        recommended: true
      licenseFile:
        description: Link to the file that details the application's license.
        range: string
      releaseNotes:
        description: Lets an operator tell what changed before accepting an update.
        range: string
        recommended: true
      site:
        description: Link to the application's website.
        range: string
      tagline:
        description: The application's slogan.
        range: string
      tags:
        description: Additional context for categorizing or searching the application.
        range: string
        multivalued: true
        inlined: true
        inlined_as_list: true

  RecommendedAuthor:
    description: Information about the application's author.
    attributes:
      name:
        description: The name of the application's creator.
        range: string
      email:
        description: Email address of the application's creator.
        range: string
        pattern: .*@[a-z0-9.-]*

  RecommendedOrganization:
    description: Information about the providing organization.
    attributes:
      name:
        description: Organization responsible for the application's development and distribution.
        range: string
        required: true
      site:
        description: Link to the organization's website.
        range: string

  RecommendedDeploymentProfile:
    description: A deployment profile that must declare at least one component.
    attributes:
      type:
        description: helm or compose.
        range: string
        required: true
        pattern: ^(helm|compose)$
      id:
        description: >-
          An identifier for the deployment profile, unique within this application
          description's scope.
        range: string
        required: true
      description:
        description: Additional context about the deployment profile's purpose.
        range: string
      components:
        description: >-
          The spec requires the slot but accepts an empty list; a profile with no component
          deploys nothing.
        range: RecommendedComponent
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
      requiredResources:
        description: Resources required to install the application.
        range: RecommendedRequiredResources
    slots:
      - x-placeholder-extensions

  RecommendedRequiredResources:
    description: Required resources element specifying the resources required to install the application.
    attributes:
      cpu:
        range: RecommendedCPU
      memory:
        range: string
        pattern: ^[0-9]+(Mi|Gi|Ki)$
      storage:
        range: string
        pattern: ^[0-9]+(Mi|Gi|Ki|Ti|Pi|Ei)$
      peripherals:
        range: RecommendedPeripheral
        multivalued: true
        inlined: true
        inlined_as_list: true
      interfaces:
        range: RecommendedCommunicationInterface
        multivalued: true
        inlined: true
        inlined_as_list: true

  RecommendedCPU:
    description: CPU element specifying the CPU requirements for the application.
    attributes:
      cores:
        range: double
        required: true
      architectures:
        range: string
        multivalued: true
        inlined: true
        inlined_as_list: true

  RecommendedPeripheral:
    description: Peripheral hardware of a device.
    attributes:
      type:
        range: string
        required: true
      manufacturer:
        range: string
      model:
        range: string

  RecommendedCommunicationInterface:
    description: Communication interface of a device.
    attributes:
      type:
        range: string
        required: true

  RecommendedComponent:
    description: A component of a deployment profile.
    attributes:
      name:
        description: >-
          A unique name used to identify the component package. Lower case letters, numbers
          and dashes only.
        range: string
        required: true
      properties:
        description: The component package's deployment details.
        range: RecommendedComponentProperties
        required: true
    slots:
      - x-placeholder-extensions

  RecommendedComponentProperties:
    description: Properties dictionary for component deployment details.
    attributes:
      repository:
        range: string
      revision:
        range: string
      wait:
        range: boolean
      timeout:
        range: string
      packageLocation:
        range: string
      keyLocation:
        range: string

  RecommendedParameter:
    description: A configurable parameter for the application.
    attributes:
      name:
        range: string
        identifier: true
      value:
        any_of:
          - range: boolean
          - range: integer
          - range: double
          - range: string
      targets:
        range: RecommendedTarget
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true

  RecommendedTarget:
    description: Specifies where the parameter applies in the deployment.
    attributes:
      pointer:
        range: string
        required: true
      components:
        range: string
        multivalued: true
        required: true

  RecommendedConfiguration:
    description: Configuration layout and validation rules.
    attributes:
      sections:
        range: RecommendedSection
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
      schema:
        range: RecommendedSchema
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true

  RecommendedSection:
    description: Named sections within the configuration layout.
    attributes:
      name:
        range: string
        required: true
      settings:
        range: RecommendedSetting
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true

  RecommendedSetting:
    description: Individual configuration settings.
    attributes:
      parameter:
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
      immutable:
        range: boolean
      schema:
        range: string
        required: true

  RecommendedSchema:
    description: >-
      Defines data type and rules for validating user provided parameter values. All
      subclass-specific rule attributes (TextValidationSchema, NumericIntegerValidationSchema,
      etc. in Schema A) are declared flat here, since this schema does not use `is_a`.
    attributes:
      name:
        range: string
        required: true
      dataType:
        range: string
        required: true
      allowEmpty:
        range: boolean
      minLength:
        range: integer
      maxLength:
        range: integer
      regexMatch:
        range: string
      minValue:
        range: float
      maxValue:
        range: float
      minPrecision:
        range: integer
      maxPrecision:
        range: integer
      multiselect:
        range: boolean
      options:
        range: string
        multivalued: true

slots:
  x-placeholder-extensions:
    description: >-
      Allows addition of arbitrary object (mapping) whose contents suppliers use to provide
      vendor-specific functionality beyond what is defined in the Margo specification.
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: false
