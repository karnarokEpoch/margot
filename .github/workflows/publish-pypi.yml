name: Publish to PyPI

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Git tag of the GitHub release to publish (e.g. 1.2.3)"
        required: true
        type: string

jobs:
  publish:
    # release.yml creates the GitHub release using GITHUB_TOKEN, so the
    # `release: published` event never fires (GitHub does not chain workflow
    # runs triggered by the default token). Trigger off the Release workflow
    # itself instead.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing

    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ steps.tag.outputs.version }} \
            --repo ${{ github.repository }} \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --dir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
