name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Manual release of an already-tagged commit on main (e.g. promoting 0.12.1-rc0 to 0.12.1).
  # Guarded by .github/scripts/check-tagged-release.sh: HEAD must already carry a tag and the
  # requested tag must not exist yet.
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version to release, e.g. 0.12.1 (no leading v). HEAD of main must already carry a tag."
        required: true
        type: string

jobs:
  release:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 also fetches all tags, which the manual-run guard and git-cliff need.
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${HEAD_REF#release/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # SemVer pre-release iff the version contains a "-" (0.12.1-rc0, 1.0.0-beta.1)
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: astral-sh/setup-uv@v6

      - name: Validate SemVer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uvx --from 'semver>=3.0,<4.0' pysemver check "$VERSION"

      - name: Guard manual release (HEAD tagged, tag not yet used)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/check-tagged-release.sh "$VERSION"

      - name: Tag the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tags the checked-out commit: the merge commit (PR path) or HEAD of main (manual path, guarded above).
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Pin built version to the requested release (manual path)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Pins the version explicitly (hatch-vcs honours this variable over git tags). With both
        # 0.12.1-rc0 and 0.12.1 on HEAD, hatch-vcs alone also picked 0.12.1 in local tests, but the
        # pin does not rely on that. The wheel check below verifies the result.
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build
        run: uv build

      - name: Assert built wheel version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#WHEELS[@]}"
            exit 1
          fi
          # Wheel names are {name}-{version}-{tags}.whl. The version is PEP 440 normalised
          # (0.12.1-rc0 -> 0.12.1rc0), so compare with the normalised requested version.
          BUILT=$(basename "${WHEELS[0]}" | cut -d- -f2)
          EXPECTED=$(uv run --no-project --with packaging python \
            -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "$VERSION")
          if [ "$BUILT" != "$EXPECTED" ]; then
            echo "::error::built wheel is ${BUILT}, expected ${EXPECTED} for ${VERSION}"
            exit 1
          fi
          echo "Wheel version OK: ${BUILT}"

      - name: Generate changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # HEAD may carry two tags (e.g. 0.12.1-rc0 and 0.12.1), so --latest is unreliable.
            # Cover everything since the previous release: the newest tag on an ancestor of HEAD
            # (--no-contains HEAD drops tags on HEAD itself). Stable releases compare only with
            # stable tags; pre-releases may compare with any tag. Old v* tags do not match the pattern.
            if [ "$PRERELEASE" = "true" ]; then
              PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
            else
              PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
            fi
            PREV=$(git tag --merged HEAD --no-contains HEAD | grep -E "$PATTERN" | sort -V | tail -n 1 || true)
            if [ -n "$PREV" ]; then RANGE="${PREV}..HEAD"; else RANGE="HEAD"; fi
            echo "Changelog range: ${RANGE}"
            uvx git-cliff "$RANGE" --tag "$VERSION" --strip header -o RELEASE_NOTES.md
            # git-cliff ignores --tag for commits that already carry a tag and labels the section
            # with that tag (e.g. 0.12.1-rc0). Rewrite the first release heading to this version.
            sed -i -E "0,/^## \[/s/^## \[[^]]*\]/## [${VERSION}]/" RELEASE_NOTES.md
          else
            uvx git-cliff --latest --strip header -o RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::RELEASE_NOTES.md is empty"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 1

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          ARGS=(--title "$VERSION" --notes-file RELEASE_NOTES.md --target main)
          # Pre-releases must not become the repository's "Latest" release
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$VERSION" dist/* "${ARGS[@]}"

  # Build + verify the image first via the shared action (local registry, nothing published).
  # Only then are the GHCR tags published, by copying the tested digest (no rebuild).
  # Stable versions get :<version> and :latest; pre-releases (version contains "-")
  # get only :<version> so they never take over :latest.
  container:
    name: Publish container image
    needs: release
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image name
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download release wheel
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Build and verify image
        id: tested
        uses: ./.github/actions/build-verify-image

      - name: "RELEASE ONLY: log in to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "RELEASE ONLY: promote tested image to GHCR"
        env:
          REF: ${{ steps.tested.outputs.ref }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          TAGS=("ghcr.io/${IMAGE_NAME}:${VERSION}")
          # Pre-releases never take over :latest
          if [ "$PRERELEASE" != "true" ]; then
            TAGS+=("ghcr.io/${IMAGE_NAME}:latest")
          fi
          .github/scripts/promote-image.sh "$REF" "${TAGS[@]}"
