name: Container Check

# TEST ONLY — builds and verifies the multi-arch image against local registries; publishes nothing.
#
# Runs the shared build-verify action, then rehearses the release promote step against a
# second local registry (port 5001, a stand-in for GHCR). Only the login and the
# destination host differ from the real release.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel
        run: uv build

      - name: Build and verify image
        id: image
        uses: ./.github/actions/build-verify-image

      - name: Start stand-in release registry (port 5001)
        run: |
          docker run -d -p 5001:5000 --name registry-release registry:2
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:5001/v2/ && exit 0
            sleep 1
          done
          echo "::error::release stand-in registry did not become ready"
          exit 1

      - name: Dry-run promote (same script as release)
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          .github/scripts/promote-image.sh "$REF" \
            localhost:5001/margot:check \
            localhost:5001/margot:check-latest
