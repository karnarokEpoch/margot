site_name: margot
site_description: Developer CLI for building and publishing Margo application packages
repo_url: https://github.com/karnarokEpoch/margot
repo_name: karnarokEpoch/margot

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

nav:
  - Home: index.md
  - margo.yaml: margo-yaml.md
  - Examples:
    - Minimal (Helm): examples/minimal.md
    - Basic (Quadlet): examples/basic-quadlet.md
    - Image search-and-replace (Compose): examples/image-search-replace.md
    - Full (Multi-component): examples/full.md

markdown_extensions:
  - admonition
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
